[project]
name = "oosim"
version = "0.2.0"
description = "Open On-Orbit Servicing Simulator: end-to-end framework for rendezvous and robotic berthing simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE-CODE" }
authors = [
  { name = "Giovane Morais", email = "giovane@ita.br" },
  { name = "Ijar Milagre da Fonseca", email = "ijar@ita.br" },
  { name = "Emília Villani", email = "evillani@ita.br" }
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "astropy>=6.0",
  "sgp4>=2.23",
  "matplotlib>=3.8",
  "cvxpy>=1.5",
  "ecos>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "ipykernel>=6.29", "jupyter>=1.0"]
gpu = ["cupy-cuda12x>=13.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oosim*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
